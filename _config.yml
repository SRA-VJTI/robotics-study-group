theme: jekyll-theme-cayman
title: Robotics Study Group
description: A build-first path from robot-learning fundamentals to robot foundation models
show_downloads: false
kramdown:
  # Emit raw delimiters and let MathJax (loaded in _includes/head-custom.html) render them.
  math_engine: null
exclude:
  - tmp
  # Lecture deck renders are archived in the repository but not published to
  # the site. Delete this line and re-add the slide-deck include to restore.
  - assets/lectures
