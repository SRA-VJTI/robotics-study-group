<path d="M590,246 C590,196 90,196 90,246" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#ao)"/>
<path d="M490,246 C490,222 190,222 190,246" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ag)"/>
<text x="350" y="318" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">t6 reads t1 in 1 hop: no chain, no bottleneck</text>

