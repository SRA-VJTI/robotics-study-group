<circle cx="390" cy="90" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="390" y="95" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t4</text>
<line x1="413" y1="90" x2="467" y2="90" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="490" cy="90" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="490" y="95" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t5</text>
<line x1="513" y1="90" x2="567" y2="90" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="590" cy="90" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="590" y="95" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t6</text>
<text x="350" y="140" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">t1 to t6 takes 5 hops, and the signal is squashed at each one</text>
<text x="20" y="190" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">Attention: any token reads any other token directly</text>
