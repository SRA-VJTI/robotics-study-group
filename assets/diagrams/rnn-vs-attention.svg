<text x="190" y="275" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t2</text>
<circle cx="290" cy="270" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="290" y="275" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t3</text>
<circle cx="390" cy="270" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="390" y="275" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t4</text>
<circle cx="490" cy="270" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="490" y="275" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t5</text>
<circle cx="590" cy="270" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
