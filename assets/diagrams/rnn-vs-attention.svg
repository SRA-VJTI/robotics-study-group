<circle cx="190" cy="90" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="190" y="95" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t2</text>
<line x1="213" y1="90" x2="267" y2="90" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<circle cx="290" cy="90" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="290" y="95" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">t3</text>
