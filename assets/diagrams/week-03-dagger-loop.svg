<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">The DAgger loop</title>
  <desc id="desc">Cycle: roll out the policy, expert labels the visited states, aggregate into the dataset, retrain, repeat.</desc>
  <defs><marker id="lp" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0 0 L7 2.5 L0 5 z" fill="#8b95a5"/></marker></defs>
  <g fill="none" stroke="#8b95a5" stroke-width="1.5">
    <rect x="60" y="30" width="200" height="56" rx="10"/>
    <rect x="500" y="30" width="200" height="56" rx="10"/>
    <rect x="500" y="160" width="200" height="56" rx="10"/>
    <rect x="60" y="160" width="200" height="56" rx="10"/>
  </g>
  <g fill="none" stroke="#8b95a5" stroke-width="1.5" marker-end="url(#lp)">
    <path d="M260 58 H492"/>
    <path d="M600 86 V152"/>
    <path d="M500 188 H268"/>
    <path d="M160 160 V94"/>
  </g>
  <g font-family="DM Sans, sans-serif" font-size="14" text-anchor="middle" fill="#8b95a5">
    <text x="160" y="63">roll out π<tspan font-size="11" dy="2">θ</tspan></text>
    <text x="600" y="63">expert labels a* at visited s′</text>
    <text x="600" y="193">D ← D ∪ {(s′, a*)}</text>
    <text x="160" y="193">retrain π<tspan font-size="11" dy="2">θ</tspan><tspan dy="-2"> on D</tspan></text>
    <text x="380" y="128" font-size="12" font-style="italic">repeat</text>
  </g>
</svg>
