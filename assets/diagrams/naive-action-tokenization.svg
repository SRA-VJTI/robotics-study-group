<svg viewBox="0 0 820 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="400" fill="#ffffff"/>

  <!-- Panel A: binning -->
  <rect x="10" y="15" width="400" height="228" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="22" y="34" fill="#222" font-weight="600" font-size="12">1. Bin each action dimension</text>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="40" y1="50" x2="385" y2="50"/><line x1="40" y1="64" x2="385" y2="64"/><line x1="40" y1="78" x2="385" y2="78"/>
    <line x1="40" y1="92" x2="385" y2="92"/><line x1="40" y1="106" x2="385" y2="106"/><line x1="40" y1="120" x2="385" y2="120"/>
    <line x1="40" y1="134" x2="385" y2="134"/><line x1="40" y1="148" x2="385" y2="148"/><line x1="40" y1="162" x2="385" y2="162"/>
    <line x1="40" y1="176" x2="385" y2="176"/>
  </g>
  <g stroke="#999" stroke-width="1.2"><line x1="40" y1="50" x2="40" y2="190"/><line x1="40" y1="190" x2="385" y2="190"/></g>
  <text x="385" y="46" text-anchor="end" fill="#666" font-size="10">(10 of 256 bins shown)</text>
  <text x="36" y="54" text-anchor="end" fill="#666" font-size="10">+1</text>
  <text x="36" y="193" text-anchor="end" fill="#666" font-size="10">−1</text>
  <path d="M55,150 L75,149 L95,147 L115,143 L135,137 L155,129 L175,121 L195,111 L215,103 L235,96 L255,91 L275,88 L295,86 L315,85 L335,85 L355,85" fill="none" stroke="#0284c7" stroke-width="1.8"/>
  <g fill="#0284c7">
    <circle cx="55" cy="150" r="3.5"/><circle cx="75" cy="149" r="3.5"/><circle cx="95" cy="147" r="3.5"/><circle cx="115" cy="143" r="3.5"/>
    <circle cx="135" cy="137" r="3.5"/><circle cx="155" cy="129" r="3.5"/><circle cx="175" cy="121" r="3.5"/><circle cx="195" cy="111" r="3.5"/>
    <circle cx="215" cy="103" r="3.5"/><circle cx="235" cy="96" r="3.5"/><circle cx="255" cy="91" r="3.5"/><circle cx="275" cy="88" r="3.5"/>
    <circle cx="295" cy="86" r="3.5"/><circle cx="315" cy="85" r="3.5"/><circle cx="335" cy="85" r="3.5"/><circle cx="355" cy="85" r="3.5"/>
  </g>
  <g fill="#bfdbfe" stroke="#93c5fd" stroke-width="1">
    <rect x="46" y="205" width="18" height="20" rx="3"/><rect x="66" y="205" width="18" height="20" rx="3"/><rect x="86" y="205" width="18" height="20" rx="3"/><rect x="106" y="205" width="18" height="20" rx="3"/>
    <rect x="126" y="205" width="18" height="20" rx="3"/><rect x="146" y="205" width="18" height="20" rx="3"/><rect x="166" y="205" width="18" height="20" rx="3"/><rect x="186" y="205" width="18" height="20" rx="3"/>
    <rect x="206" y="205" width="18" height="20" rx="3"/><rect x="226" y="205" width="18" height="20" rx="3"/><rect x="246" y="205" width="18" height="20" rx="3"/><rect x="266" y="205" width="18" height="20" rx="3"/>
    <rect x="286" y="205" width="18" height="20" rx="3"/><rect x="306" y="205" width="18" height="20" rx="3"/><rect x="326" y="205" width="18" height="20" rx="3"/><rect x="346" y="205" width="18" height="20" rx="3"/>
  </g>
  <g text-anchor="middle" fill="#1e3a8a" font-size="10">
    <text x="55" y="219">2</text><text x="75" y="219">2</text><text x="95" y="219">3</text><text x="115" y="219">3</text>
    <text x="135" y="219">3</text><text x="155" y="219">4</text><text x="175" y="219">4</text><text x="195" y="219">5</text>
    <text x="215" y="219">6</text><text x="235" y="219">6</text><text x="255" y="219">7</text><text x="275" y="219">7</text>
    <text x="295" y="219">7</text><text x="315" y="219">7</text><text x="335" y="219">7</text><text x="355" y="219">7</text>
  </g>
  <text x="210" y="237" text-anchor="middle" fill="#666" font-size="10">tokens = bin ids: consecutive tokens are nearly identical</text>

  <!-- Panel B: copy shortcut -->
  <rect x="420" y="15" width="390" height="228" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="432" y="34" fill="#222" font-weight="600" font-size="12">2. The autoregressive shortcut</text>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.3">
    <rect x="470" y="52" width="50" height="28" rx="6"/><rect x="540" y="52" width="50" height="28" rx="6"/><rect x="610" y="52" width="50" height="28" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#14532d"><text x="495" y="71">7</text><text x="565" y="71">7</text><text x="635" y="71">7</text></g>
  <text x="440" y="71" fill="#666" font-size="10">out</text>
  <rect x="440" y="108" width="240" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="560" y="130" text-anchor="middle" fill="#222" font-weight="600">Autoregressive</text>
  <text x="560" y="148" text-anchor="middle" fill="#222" font-weight="600">transformer</text>
  <g fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.3">
    <rect x="460" y="190" width="50" height="28" rx="6"/><rect x="530" y="190" width="50" height="28" rx="6"/><rect x="600" y="190" width="50" height="28" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1e3a8a"><text x="485" y="209">7</text><text x="555" y="209">7</text><text x="625" y="209">7</text></g>
  <text x="440" y="209" fill="#666" font-size="10">in</text>
  <g stroke="#555" stroke-width="1.3">
    <line x1="485" y1="188" x2="485" y2="160" marker-end="url(#arr)"/><line x1="555" y1="188" x2="555" y2="160" marker-end="url(#arr)"/><line x1="625" y1="188" x2="625" y2="160" marker-end="url(#arr)"/>
    <line x1="495" y1="106" x2="495" y2="82" marker-end="url(#arr)"/><line x1="565" y1="106" x2="565" y2="82" marker-end="url(#arr)"/><line x1="635" y1="106" x2="635" y2="82" marker-end="url(#arr)"/>
  </g>
  <g fill="#b91c1c" font-size="12">
    <text x="700" y="100" font-weight="600">next token ≈</text>
    <text x="700" y="117" font-weight="600">previous token</text>
    <text x="700" y="141" fill="#444" font-size="11">low loss by</text>
    <text x="700" y="157" fill="#444" font-size="11">copying, without</text>
    <text x="700" y="173" fill="#444" font-size="11">learning the skill</text>
  </g>

  <!-- Panel C: result -->
  <rect x="10" y="253" width="800" height="137" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="22" y="270" fill="#222" font-weight="600" font-size="12">Task success vs control frequency, naive binning (approx., read from the lecture plot)</text>
  <g stroke="#999" stroke-width="1.2"><line x1="70" y1="280" x2="70" y2="362"/><line x1="70" y1="362" x2="390" y2="362"/></g>
  <line x1="70" y1="349.7" x2="390" y2="349.7" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="64" y="353" text-anchor="end" fill="#666" font-size="10">0</text>
  <path d="M100,336.2 L190,305.4 L280,343.5 L370,350.9" fill="none" stroke="#b45309" stroke-width="2"/>
  <g fill="#b45309"><circle cx="100" cy="336.2" r="4"/><circle cx="190" cy="305.4" r="4"/><circle cx="280" cy="343.5" r="4"/><circle cx="370" cy="350.9" r="4"/></g>
  <g text-anchor="middle" fill="#666" font-size="11"><text x="100" y="377">2 Hz</text><text x="190" y="377">5 Hz</text><text x="280" y="377">10 Hz</text><text x="370" y="377">20 Hz</text></g>
  <g fill="#222">
    <text x="450" y="294" font-weight="600">As control frequency increases:</text>
    <text x="450" y="316">• information per token decreases</text>
    <text x="450" y="336">• correlation between consecutive tokens increases</text>
    <text x="450" y="366" fill="#b91c1c" font-weight="600">→ Solution: compression</text>
  </g>
</svg>
