<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="860" height="400" fill="#ffffff"/>

  <!-- Image inputs -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.3">
    <rect x="15" y="45" width="80" height="34" rx="4"/>
    <rect x="15" y="95" width="80" height="34" rx="4"/>
    <rect x="15" y="145" width="80" height="34" rx="4"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="55" y="67">image 1</text>
    <text x="55" y="117">image 2</text>
    <text x="55" y="167">image N</text>
  </g>
  <g stroke="#555" stroke-width="1.3" fill="none">
    <line x1="95" y1="62" x2="106" y2="62"/><line x1="95" y1="112" x2="106" y2="112"/><line x1="95" y1="162" x2="106" y2="162"/>
    <line x1="106" y1="62" x2="106" y2="162"/>
  </g>
  <line x1="106" y1="112" x2="118" y2="112" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Image encoder -->
  <rect x="120" y="75" width="95" height="74" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#1e3a8a" font-weight="600">
    <text x="167" y="102">image</text><text x="167" y="118">encoder</text>
  </g>
  <text x="167" y="136" text-anchor="middle" fill="#1d4ed8" font-size="12">(ViT)</text>
  <line x1="215" y1="112" x2="238" y2="112" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Image projection -->
  <rect x="240" y="88" width="62" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222"><text x="271" y="108">proj.</text><text x="271" y="126" font-style="italic">W_i</text></g>
  <g stroke="#555" stroke-width="1.3" fill="none">
    <line x1="302" y1="112" x2="312" y2="112"/><line x1="312" y1="62" x2="312" y2="162"/>
  </g>
  <g stroke="#555" stroke-width="1.3">
    <line x1="312" y1="62" x2="323" y2="62" marker-end="url(#arr)"/>
    <line x1="312" y1="112" x2="323" y2="112" marker-end="url(#arr)"/>
    <line x1="312" y1="162" x2="323" y2="162" marker-end="url(#arr)"/>
  </g>

  <!-- Embeddings -->
  <g fill="#93c5fd" stroke="#2563eb" stroke-width="1.3">
    <rect x="325" y="48" width="60" height="28" rx="4"/>
    <rect x="325" y="98" width="60" height="28" rx="4"/>
    <rect x="325" y="148" width="60" height="28" rx="4"/>
  </g>
  <g fill="#1e3a8a" text-anchor="middle" font-weight="600">
    <text x="355" y="67">I1</text><text x="355" y="117">I2</text><text x="355" y="167">IN</text>
  </g>
  <g fill="#fdba74" stroke="#ea580c" stroke-width="1.3">
    <rect x="475" y="48" width="60" height="28" rx="4"/>
    <rect x="475" y="98" width="60" height="28" rx="4"/>
    <rect x="475" y="148" width="60" height="28" rx="4"/>
  </g>
  <g fill="#7c2d12" text-anchor="middle" font-weight="600">
    <text x="505" y="67">T1</text><text x="505" y="117">T2</text><text x="505" y="167">TN</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4">
    <line x1="387" y1="62" x2="473" y2="62"/><line x1="387" y1="112" x2="473" y2="112"/><line x1="387" y1="162" x2="473" y2="162"/>
  </g>
  <text x="430" y="34" text-anchor="middle" fill="#15803d" font-weight="600">cosine similarity</text>
  <text x="355" y="198" text-anchor="middle" fill="#444" font-size="12">image emb.</text>
  <text x="505" y="198" text-anchor="middle" fill="#444" font-size="12">text emb.</text>

  <!-- Text side (mirrored) -->
  <g stroke="#555" stroke-width="1.3" fill="none">
    <line x1="548" y1="112" x2="560" y2="112"/><line x1="548" y1="62" x2="548" y2="162"/>
  </g>
  <g stroke="#555" stroke-width="1.3">
    <line x1="548" y1="62" x2="537" y2="62" marker-end="url(#arr)"/>
    <line x1="548" y1="112" x2="537" y2="112" marker-end="url(#arr)"/>
    <line x1="548" y1="162" x2="537" y2="162" marker-end="url(#arr)"/>
  </g>
  <rect x="560" y="88" width="62" height="48" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#222"><text x="591" y="108">proj.</text><text x="591" y="126" font-style="italic">W_t</text></g>
  <line x1="645" y1="112" x2="624" y2="112" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="645" y="75" width="95" height="74" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#7c2d12" font-weight="600">
    <text x="692" y="102">text</text><text x="692" y="118">encoder</text>
  </g>
  <text x="692" y="136" text-anchor="middle" fill="#9a3412" font-size="11">(transformer)</text>
  <line x1="754" y1="112" x2="742" y2="112" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <g stroke="#555" stroke-width="1.3" fill="none">
    <line x1="765" y1="62" x2="754" y2="62"/><line x1="765" y1="112" x2="754" y2="112"/><line x1="765" y1="162" x2="754" y2="162"/>
    <line x1="754" y1="62" x2="754" y2="162"/>
  </g>
  <g fill="#fed7aa" stroke="#ea580c" stroke-width="1.3">
    <rect x="765" y="45" width="80" height="34" rx="4"/>
    <rect x="765" y="95" width="80" height="34" rx="4"/>
    <rect x="765" y="145" width="80" height="34" rx="4"/>
  </g>
  <g fill="#222" text-anchor="middle" font-size="11">
    <text x="805" y="66">“a dog running”</text>
    <text x="805" y="116">“green forest”</text>
    <text x="805" y="166">“city at night”</text>
  </g>

  <!-- Similarity matrix -->
  <text x="182" y="226" text-anchor="middle" fill="#222" font-weight="600" font-size="12">N × N similarity matrix</text>
  <g text-anchor="middle" fill="#7c2d12" font-weight="600" font-size="12">
    <text x="113" y="245">T1</text><text x="159" y="245">T2</text><text x="205" y="245">T3</text><text x="251" y="245">TN</text>
  </g>
  <g text-anchor="end" fill="#1e3a8a" font-weight="600" font-size="12">
    <text x="84" y="272">I1</text><text x="84" y="306">I2</text><text x="84" y="340">I3</text><text x="84" y="374">IN</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1" fill="#ffffff">
    <rect x="90" y="252" width="46" height="34"/><rect x="136" y="252" width="46" height="34"/><rect x="182" y="252" width="46" height="34"/><rect x="228" y="252" width="46" height="34"/>
    <rect x="90" y="286" width="46" height="34"/><rect x="136" y="286" width="46" height="34"/><rect x="182" y="286" width="46" height="34"/><rect x="228" y="286" width="46" height="34"/>
    <rect x="90" y="320" width="46" height="34"/><rect x="136" y="320" width="46" height="34"/><rect x="182" y="320" width="46" height="34"/><rect x="228" y="320" width="46" height="34"/>
    <rect x="90" y="354" width="46" height="34"/><rect x="136" y="354" width="46" height="34"/><rect x="182" y="354" width="46" height="34"/><rect x="228" y="354" width="46" height="34"/>
  </g>
  <g fill="#bfdbfe" stroke="#2563eb" stroke-width="1.3">
    <rect x="90" y="252" width="46" height="34"/><rect x="136" y="286" width="46" height="34"/><rect x="182" y="320" width="46" height="34"/><rect x="228" y="354" width="46" height="34"/>
  </g>
  <g text-anchor="middle" fill="#334155" font-size="10">
    <text x="113" y="273">I1·T1</text><text x="159" y="273">I1·T2</text><text x="205" y="273">I1·T3</text><text x="251" y="273">I1·TN</text>
    <text x="113" y="307">I2·T1</text><text x="159" y="307">I2·T2</text><text x="205" y="307">I2·T3</text><text x="251" y="307">I2·TN</text>
    <text x="113" y="341">I3·T1</text><text x="159" y="341">I3·T2</text><text x="205" y="341">I3·T3</text><text x="251" y="341">I3·TN</text>
    <text x="113" y="375">IN·T1</text><text x="159" y="375">IN·T2</text><text x="205" y="375">IN·T3</text><text x="251" y="375">IN·TN</text>
  </g>

  <!-- Explanation box -->
  <rect x="300" y="232" width="545" height="156" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <g fill="#222" font-size="13">
    <text x="318" y="260" font-weight="600">sim(i, j) = cos(image i, text j)</text>
    <text x="318" y="284">Diagonal = true pairs → pulled together</text>
    <text x="318" y="304">Off-diagonal = other pairs in the batch → pushed apart (negatives)</text>
    <text x="318" y="328">Row i: softmax over N texts → image-to-text loss</text>
    <text x="318" y="348">Column i: softmax over N images → text-to-image loss</text>
    <text x="318" y="372">τ = learnable temperature (sharpness of the softmax)</text>
  </g>
</svg>
