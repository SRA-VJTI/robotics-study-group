<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="720" height="430" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">KV cache while generating: one new entry per token, old entries reused</text>
<text x="20" y="90" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Step 1</text>
<rect x="95" y="68" width="100" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
<text x="145" y="87" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">new: "the"</text>
<text x="145" y="103" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">compute q, k, v</text>
<line x1="195" y1="90" x2="258" y2="90" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
<rect x="262" y="68" width="80" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="302" y="87" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">k1, v1</text>
<text x="302" y="103" font-size="11" font-weight="normal" fill="#ea580c" text-anchor="middle">just added</text>
<text x="640" y="94" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="start">1 entry</text>
<text x="20" y="172" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Step 2</text>
<rect x="95" y="150" width="100" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
<text x="145" y="169" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">new: "robot"</text>
<text x="145" y="185" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">compute q, k, v</text>
<line x1="195" y1="172" x2="258" y2="172" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
<rect x="262" y="150" width="80" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="302" y="169" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">k1, v1</text>
<text x="302" y="185" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">reused</text>
<rect x="350" y="150" width="80" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="390" y="169" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">k2, v2</text>
<text x="390" y="185" font-size="11" font-weight="normal" fill="#ea580c" text-anchor="middle">just added</text>
<text x="640" y="176" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="start">2 entries</text>
<text x="20" y="254" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Step 3</text>
<rect x="95" y="232" width="100" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
<text x="145" y="251" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">new: "picked"</text>
<text x="145" y="267" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">compute q, k, v</text>
<line x1="195" y1="254" x2="258" y2="254" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
<rect x="262" y="232" width="80" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="302" y="251" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">k1, v1</text>
<text x="302" y="267" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">reused</text>
<rect x="350" y="232" width="80" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="390" y="251" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">k2, v2</text>
<text x="390" y="267" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">reused</text>
<rect x="438" y="232" width="80" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="478" y="251" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">k3, v3</text>
<text x="478" y="267" font-size="11" font-weight="normal" fill="#ea580c" text-anchor="middle">just added</text>
<text x="640" y="258" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="start">3 entries</text>
<text x="20" y="336" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="start">Step 4</text>
<rect x="95" y="314" width="100" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
<text x="145" y="333" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">new: "up"</text>
<text x="145" y="349" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">compute q, k, v</text>
<line x1="195" y1="336" x2="258" y2="336" stroke="#ea580c" stroke-width="2" marker-end="url(#ao)"/>
<rect x="262" y="314" width="80" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="302" y="333" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">k1, v1</text>
<text x="302" y="349" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">reused</text>
<rect x="350" y="314" width="80" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="390" y="333" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">k2, v2</text>
<text x="390" y="349" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">reused</text>
<rect x="438" y="314" width="80" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="478" y="333" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">k3, v3</text>
<text x="478" y="349" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">reused</text>
<rect x="526" y="314" width="80" height="44" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="566" y="333" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">k4, v4</text>
<text x="566" y="349" font-size="11" font-weight="normal" fill="#ea580c" text-anchor="middle">just added</text>
<text x="640" y="340" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="start">4 entries</text>
<text x="360" y="392" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">q reads every cached k and v, then is thrown away. Only keys and values are stored.</text>
<text x="360" y="412" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">Llama-3-8B (16-bit): 128 KB per token, about 1 GB at 8k context.</text>

</svg>
