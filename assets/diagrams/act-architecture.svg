<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="340" fill="#ffffff"/>

  <!-- z (training only) -->
  <rect x="210" y="12" width="220" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="320" y="29" text-anchor="middle" fill="#7c2d12" font-weight="600" font-size="12">z: style variable (CVAE)</text>
  <text x="320" y="44" text-anchor="middle" fill="#9a3412" font-size="10">learned in training, z = 0 at test time</text>
  <line x1="320" y1="52" x2="320" y2="98" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <!-- Cameras -->
  <g stroke="#2563eb" stroke-width="1.2" fill="#dbeafe">
    <rect x="20" y="100" width="80" height="20" rx="4"/><rect x="20" y="126" width="80" height="20" rx="4"/>
    <rect x="20" y="152" width="80" height="20" rx="4"/><rect x="20" y="178" width="80" height="20" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1e3a8a" font-size="11">
    <text x="60" y="114">camera 1</text><text x="60" y="140">camera 2</text><text x="60" y="166">camera 3</text><text x="60" y="192">camera 4</text>
  </g>
  <g stroke="#555" stroke-width="1.3" fill="none">
    <line x1="100" y1="110" x2="110" y2="110"/><line x1="100" y1="136" x2="110" y2="136"/><line x1="100" y1="162" x2="110" y2="162"/><line x1="100" y1="188" x2="110" y2="188"/>
    <line x1="110" y1="110" x2="110" y2="188"/>
  </g>
  <line x1="110" y1="149" x2="123" y2="149" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="125" y="100" width="85" height="98" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
  <text x="167" y="146" text-anchor="middle" fill="#1e3a8a" font-weight="600">ResNet18</text>
  <text x="167" y="163" text-anchor="middle" fill="#1d4ed8" font-size="11">image tokens</text>
  <line x1="212" y1="149" x2="248" y2="149" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Joints -->
  <rect x="20" y="212" width="80" height="26" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="60" y="229" text-anchor="middle" fill="#1e3a8a" font-size="11">joints (14)</text>
  <line x1="100" y1="225" x2="248" y2="225" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Encoder -->
  <rect x="250" y="100" width="140" height="140" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="320" y="156" text-anchor="middle" fill="#4c1d95" font-weight="700">Transformer</text>
  <text x="320" y="174" text-anchor="middle" fill="#4c1d95" font-weight="700">encoder</text>
  <text x="320" y="196" text-anchor="middle" fill="#6d28d9" font-size="11">fuses images,</text>
  <text x="320" y="211" text-anchor="middle" fill="#6d28d9" font-size="11">joints and z</text>
  <line x1="392" y1="170" x2="448" y2="170" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Decoder -->
  <rect x="450" y="100" width="140" height="140" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="520" y="156" text-anchor="middle" fill="#4c1d95" font-weight="700">Transformer</text>
  <text x="520" y="174" text-anchor="middle" fill="#4c1d95" font-weight="700">decoder</text>
  <text x="520" y="196" text-anchor="middle" fill="#6d28d9" font-size="11">cross-attends to</text>
  <text x="520" y="211" text-anchor="middle" fill="#6d28d9" font-size="11">the encoder</text>
  <rect x="450" y="262" width="140" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="520" y="282" text-anchor="middle" fill="#78350f" font-size="11">k fixed queries</text>
  <line x1="520" y1="260" x2="520" y2="242" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- Output -->
  <line x1="592" y1="170" x2="638" y2="170" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
  <rect x="640" y="122" width="160" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <g text-anchor="middle" fill="#14532d">
    <text x="720" y="152" font-weight="600">action chunk</text>
    <text x="720" y="172">k × 14 values</text>
    <text x="720" y="190" font-size="11">k = 100 at 50 Hz</text>
    <text x="720" y="206" font-size="11">(2 s of motion)</text>
  </g>

  <!-- Inference note -->
  <rect x="20" y="304" width="780" height="28" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="410" y="323" text-anchor="middle" fill="#333" font-size="12">Inference: query every step and blend the overlapping chunks (temporal ensembling) → smooth, yet still reactive</text>
</svg>
