<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="720" height="372" fill="#ffffff"/>
<text x="100.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t0</text>
<text x="180.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t1</text>
<text x="260.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t2</text>
<text x="340.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t3</text>
<text x="420.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t4</text>
<text x="500.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t5</text>
<text x="580.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t6</text>
<text x="660.0" y="24" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">t7</text>
<text x="20" y="52" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">One-step policy: one action per query, each chosen independently</text>
<rect x="64" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="100.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a0</text>
<rect x="144" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="180.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a1</text>
<rect x="224" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="260.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a2</text>
<rect x="304" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="340.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a3</text>
<rect x="384" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="420.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a4</text>
<rect x="464" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="500.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a5</text>
<rect x="544" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="580.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a6</text>
<rect x="624" y="62" width="72" height="28" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="660.0" y="81" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">a7</text>
<text x="20" y="118" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Action chunk (k = 4): query once, run 4 actions, then query again</text>
<rect x="64" y="128" width="312" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="220" y="147" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">query at t0: a0 to a3</text>
