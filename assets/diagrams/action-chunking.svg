<text x="540" y="147" font-size="13" font-weight="normal" fill="#1f2937" text-anchor="middle">query at t4: a4 to a7</text>
<text x="20" y="186" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="start">Temporal ensembling: query every step, blend overlapping predictions</text>
<rect x="64" y="196" width="312" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="72" y="212" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">query at t0</text>
<rect x="144" y="226" width="312" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="152" y="242" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">query at t1</text>
<rect x="224" y="256" width="312" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="232" y="272" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">query at t2</text>
<rect x="304" y="286" width="312" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="312" y="302" font-size="12" font-weight="normal" fill="#1f2937" text-anchor="start">query at t3</text>
<rect x="302" y="192" width="76" height="124" rx="6" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="340.0" y="336" font-size="12" font-weight="normal" fill="#ea580c" text-anchor="middle">t3 gets 4 predictions,</text>
<text x="340.0" y="352" font-size="12" font-weight="normal" fill="#ea580c" text-anchor="middle">blended with decaying weights</text>

