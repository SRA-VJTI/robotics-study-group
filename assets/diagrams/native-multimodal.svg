<svg viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="820" height="430" fill="#ffffff"/>

  <!-- Modalities -->
  <g stroke-width="1.4">
    <rect x="20" y="45" width="80" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="125" y="45" width="100" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <rect x="20" y="100" width="80" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <rect x="125" y="100" width="100" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <rect x="20" y="155" width="80" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="125" y="155" width="100" height="40" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <rect x="20" y="210" width="80" height="40" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
    <rect x="125" y="210" width="100" height="40" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="60" y="70" fill="#1e3a8a">image</text><text x="175" y="70" fill="#1e3a8a">vision enc.</text>
    <text x="60" y="125" fill="#78350f">audio</text><text x="175" y="125" fill="#78350f">audio enc.</text>
    <text x="60" y="180" fill="#7f1d1d">video</text><text x="175" y="180" fill="#7f1d1d">video enc.</text>
    <text x="60" y="235" fill="#4c1d95">text</text><text x="175" y="235" fill="#4c1d95">tokenizer</text>
  </g>
  <g stroke="#555" stroke-width="1.4">
    <line x1="102" y1="65" x2="123" y2="65" marker-end="url(#arr)"/>
    <line x1="102" y1="120" x2="123" y2="120" marker-end="url(#arr)"/>
    <line x1="102" y1="175" x2="123" y2="175" marker-end="url(#arr)"/>
    <line x1="102" y1="230" x2="123" y2="230" marker-end="url(#arr)"/>
    <line x1="227" y1="65" x2="278" y2="65" marker-end="url(#arr)"/>
    <line x1="227" y1="120" x2="278" y2="120" marker-end="url(#arr)"/>
    <line x1="227" y1="175" x2="278" y2="175" marker-end="url(#arr)"/>
    <line x1="227" y1="230" x2="278" y2="230" marker-end="url(#arr)"/>
  </g>
  <rect x="20" y="266" width="205" height="26" rx="13" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="122" y="284" text-anchor="middle" fill="#444" font-size="12">each modality is optional</text>

  <!-- Interleaved sequence box -->
  <rect x="280" y="30" width="520" height="228" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.4"/>
  <text x="540" y="50" text-anchor="middle" fill="#444" font-weight="600">interleaved token sequence (any order, any mix)</text>

  <g font-size="11" fill="#666">
    <text x="296" y="74">e.g. image captioning</text>
    <text x="296" y="120">e.g. audio transcription</text>
    <text x="296" y="166">e.g. video QA</text>
    <text x="296" y="212">e.g. multimodal reasoning</text>
  </g>

  <!-- Row 1: img img img txt txt txt -->
  <g stroke-width="1.2" font-size="11" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb"><rect x="296" y="80" width="46" height="24" rx="4"/><rect x="348" y="80" width="46" height="24" rx="4"/><rect x="400" y="80" width="46" height="24" rx="4"/></g>
    <g fill="#ede9fe" stroke="#6d28d9"><rect x="452" y="80" width="46" height="24" rx="4"/><rect x="504" y="80" width="46" height="24" rx="4"/><rect x="556" y="80" width="46" height="24" rx="4"/></g>
    <g fill="#1e3a8a"><text x="319" y="96">img</text><text x="371" y="96">img</text><text x="423" y="96">img</text></g>
    <g fill="#4c1d95"><text x="475" y="96">txt</text><text x="527" y="96">txt</text><text x="579" y="96">txt</text></g>
  </g>
  <text x="620" y="96" fill="#444" font-size="12">→ “describe this image”</text>

  <!-- Row 2: aud x4, txt -->
  <g stroke-width="1.2" font-size="11" text-anchor="middle">
    <g fill="#fef3c7" stroke="#d97706"><rect x="296" y="126" width="46" height="24" rx="4"/><rect x="348" y="126" width="46" height="24" rx="4"/><rect x="400" y="126" width="46" height="24" rx="4"/><rect x="452" y="126" width="46" height="24" rx="4"/></g>
    <g fill="#ede9fe" stroke="#6d28d9"><rect x="504" y="126" width="46" height="24" rx="4"/></g>
    <g fill="#78350f"><text x="319" y="142">aud</text><text x="371" y="142">aud</text><text x="423" y="142">aud</text><text x="475" y="142">aud</text></g>
    <g fill="#4c1d95"><text x="527" y="142">txt</text></g>
  </g>
  <text x="568" y="142" fill="#444" font-size="12">→ “transcribe this”</text>

  <!-- Row 3: vid txt vid txt vid txt -->
  <g stroke-width="1.2" font-size="11" text-anchor="middle">
    <g fill="#fee2e2" stroke="#dc2626"><rect x="296" y="172" width="46" height="24" rx="4"/><rect x="400" y="172" width="46" height="24" rx="4"/><rect x="504" y="172" width="46" height="24" rx="4"/></g>
    <g fill="#ede9fe" stroke="#6d28d9"><rect x="348" y="172" width="46" height="24" rx="4"/><rect x="452" y="172" width="46" height="24" rx="4"/><rect x="556" y="172" width="46" height="24" rx="4"/></g>
    <g fill="#7f1d1d"><text x="319" y="188">vid</text><text x="423" y="188">vid</text><text x="527" y="188">vid</text></g>
    <g fill="#4c1d95"><text x="371" y="188">txt</text><text x="475" y="188">txt</text><text x="579" y="188">txt</text></g>
  </g>
  <text x="620" y="188" fill="#444" font-size="12">freely interleaved</text>

  <!-- Row 4: img txt aud img txt aud -->
  <g stroke-width="1.2" font-size="11" text-anchor="middle">
    <g fill="#dbeafe" stroke="#2563eb"><rect x="296" y="218" width="46" height="24" rx="4"/><rect x="452" y="218" width="46" height="24" rx="4"/></g>
    <g fill="#ede9fe" stroke="#6d28d9"><rect x="348" y="218" width="46" height="24" rx="4"/><rect x="504" y="218" width="46" height="24" rx="4"/></g>
    <g fill="#fef3c7" stroke="#d97706"><rect x="400" y="218" width="46" height="24" rx="4"/><rect x="556" y="218" width="46" height="24" rx="4"/></g>
    <g fill="#1e3a8a"><text x="319" y="234">img</text><text x="475" y="234">img</text></g>
    <g fill="#4c1d95"><text x="371" y="234">txt</text><text x="527" y="234">txt</text></g>
    <g fill="#78350f"><text x="423" y="234">aud</text><text x="579" y="234">aud</text></g>
  </g>
  <text x="620" y="234" fill="#444" font-size="12">any mix, any order</text>

  <!-- Transformer + output -->
  <line x1="540" y1="258" x2="540" y2="288" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="300" y="290" width="480" height="62" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="540" y="316" text-anchor="middle" fill="#4c1d95" font-weight="700">unified multimodal transformer</text>
  <text x="540" y="336" text-anchor="middle" fill="#4c1d95" font-size="12">trained from scratch — every weight has always seen every modality</text>
  <line x1="540" y1="352" x2="540" y2="378" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="420" y="380" width="240" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="540" y="402" text-anchor="middle" fill="#14532d">text (+ image) output</text>
</svg>
