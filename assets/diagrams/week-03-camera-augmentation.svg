<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
  <title id="title">Side-camera data augmentation</title>
  <desc id="desc">Three camera views of the same road: the left view is labelled steer right, the center view straight, the right view steer left.</desc>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0 0 L7 2.5 L0 5 z" fill="#14b8a6"/></marker></defs>
  <g stroke="#8b95a5" stroke-width="1.5" fill="none">
    <line x1="40" y1="50" x2="720" y2="50"/>
    <line x1="40" y1="170" x2="720" y2="170"/>
    <line x1="40" y1="110" x2="720" y2="110" stroke-dasharray="14 12" opacity="0.5"/>
    <rect x="118" y="65" width="64" height="30" rx="8"/>
    <rect x="348" y="95" width="64" height="30" rx="8"/>
    <rect x="578" y="125" width="64" height="30" rx="8"/>
  </g>
  <g stroke="#14b8a6" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M188 82 C230 90 260 100 292 108"/>
    <path d="M418 110 H522"/>
    <path d="M648 138 C680 132 696 126 708 118"/>
  </g>
  <g font-family="DM Sans, sans-serif" font-size="13" text-anchor="middle">
    <text x="150" y="205"><tspan fill="#8b95a5">left view · </tspan><tspan fill="#14b8a6">steer right</tspan></text>
    <text x="380" y="205"><tspan fill="#8b95a5">center · </tspan><tspan fill="#14b8a6">straight</tspan></text>
    <text x="610" y="205"><tspan fill="#8b95a5">right view · </tspan><tspan fill="#14b8a6">steer left</tspan></text>
  </g>
</svg>
