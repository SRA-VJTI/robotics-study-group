<svg viewBox="0 0 760 466" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="466" fill="#ffffff"/>

  <!-- Image input -->
  <rect x="20" y="60" width="90" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <g stroke="#93c5fd" stroke-width="1"><line x1="50" y1="60" x2="50" y2="130"/><line x1="80" y1="60" x2="80" y2="130"/><line x1="20" y1="83" x2="110" y2="83"/><line x1="20" y1="106" x2="110" y2="106"/></g>
  <rect x="50" y="83" width="30" height="23" fill="#fde68a" stroke="#d97706"/>
  <text x="65" y="150" text-anchor="middle" fill="#444" font-size="12">image input</text>
  <line x1="112" y1="95" x2="132" y2="95" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- CLIP vision encoder (frozen) -->
  <rect x="134" y="55" width="130" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="199" y="86" text-anchor="middle" fill="#1e3a8a" font-weight="700">CLIP</text>
  <text x="199" y="104" text-anchor="middle" fill="#1e3a8a" font-weight="600">vision encoder</text>
  <text x="199" y="122" text-anchor="middle" fill="#1d4ed8" font-size="12">(always frozen)</text>
  <text x="199" y="153" text-anchor="middle" fill="#444" font-size="12">patch embeddings</text>
  <line x1="266" y1="95" x2="286" y2="95" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- MLP connector (trainable) -->
  <rect x="288" y="60" width="120" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="348" y="86" text-anchor="middle" fill="#78350f" font-weight="600">MLP connector</text>
  <text x="348" y="103" text-anchor="middle" fill="#78350f" font-size="12">projection layer</text>
  <text x="348" y="120" text-anchor="middle" fill="#b45309" font-size="12">(trainable)</text>
  <path d="M348,130 L348,160 L230,160 L230,192" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Text prompt -->
  <rect x="440" y="65" width="160" height="60" rx="8" fill="#f5f5f4" stroke="#78716c" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" fill="#222" font-weight="600">text prompt</text>
  <text x="520" y="111" text-anchor="middle" fill="#444">“describe this”</text>
  <line x1="520" y1="125" x2="520" y2="192" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="530" y="165" fill="#666" font-size="12">tokenize</text>

  <!-- Unified token sequence -->
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.3">
    <rect x="130" y="195" width="44" height="40" rx="5"/>
    <rect x="182" y="195" width="44" height="40" rx="5"/>
    <rect x="234" y="195" width="44" height="40" rx="5"/>
    <rect x="316" y="195" width="44" height="40" rx="5"/>
  </g>
  <g fill="#1e3a8a" text-anchor="middle" font-size="12">
    <text x="152" y="220">i1</text><text x="204" y="220">i2</text><text x="256" y="220">i3</text><text x="338" y="220">i196</text>
  </g>
  <text x="297" y="221" text-anchor="middle" fill="#555" font-size="16">…</text>
  <g fill="#ede9fe" stroke="#6d28d9" stroke-width="1.3">
    <rect x="420" y="195" width="44" height="40" rx="5"/>
    <rect x="472" y="195" width="44" height="40" rx="5"/>
    <rect x="524" y="195" width="44" height="40" rx="5"/>
    <rect x="576" y="195" width="44" height="40" rx="5"/>
  </g>
  <g fill="#4c1d95" text-anchor="middle" font-size="12">
    <text x="442" y="220">w1</text><text x="494" y="220">w2</text><text x="546" y="220">w3</text><text x="598" y="220">w4</text>
  </g>
  <g stroke="#999" stroke-width="1.2" fill="none">
    <path d="M130,243 L130,248 L360,248 L360,243"/>
    <path d="M420,243 L420,248 L620,248 L620,243"/>
  </g>
  <text x="245" y="266" text-anchor="middle" fill="#444" font-size="12">196 image tokens</text>
  <text x="520" y="266" text-anchor="middle" fill="#444" font-size="12">text tokens</text>
  <text x="383" y="284" fill="#666" font-size="12">image tokens prepended to text tokens → one sequence</text>

  <!-- LLM -->
  <line x1="375" y1="250" x2="375" y2="300" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="130" y="302" width="490" height="90" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="375" y="326" text-anchor="middle" fill="#4c1d95" font-weight="700">LLM (LLaMA)</text>
  <g fill="#4c1d95" text-anchor="middle" font-size="12">
    <text x="375" y="347">self-attention over all tokens jointly</text>
    <text x="375" y="363">standard autoregressive generation</text>
    <text x="375" y="379">no new attention mechanisms</text>
  </g>
  <line x1="375" y1="392" x2="375" y2="418" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="245" y="420" width="260" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="442" text-anchor="middle" fill="#14532d">text output: “a cat sitting on a mat”</text>
</svg>
