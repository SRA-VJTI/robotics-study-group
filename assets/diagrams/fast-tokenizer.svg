<svg viewBox="0 0 760 466" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="466" fill="#ffffff"/>

  <!-- Panel 1: action chunk -->
  <rect x="10" y="20" width="200" height="170" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="20" y="36" font-size="11" fill="#888">1</text>
  <g stroke="#999" stroke-width="1.2"><line x1="30" y1="50" x2="30" y2="135"/><line x1="30" y1="135" x2="195" y2="135"/></g>
  <path d="M36,58 C80,62 110,128 190,130" fill="none" stroke="#d97706" stroke-width="2.2"/>
  <path d="M36,128 C95,125 105,56 190,54" fill="none" stroke="#0284c7" stroke-width="2.2"/>
  <text x="110" y="162" text-anchor="middle" fill="#222" font-weight="600" font-size="12">action chunk</text>
  <text x="110" y="178" text-anchor="middle" fill="#666" font-size="10">(each action dim = a curve over time)</text>

  <line x1="214" y1="105" x2="286" y2="105" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="250" y="95" text-anchor="middle" fill="#222" font-weight="600" font-size="12">DCT</text>

  <!-- Panel 2: frequency components -->
  <rect x="290" y="20" width="200" height="170" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="300" y="36" font-size="11" fill="#888">2</text>
  <line x1="305" y1="135" x2="480" y2="135" stroke="#999" stroke-width="1.2"/>
  <g fill="#fcd34d" stroke="#d97706" stroke-width="1.2">
    <rect x="315" y="50" width="24" height="85"/>
    <rect x="350" y="75" width="24" height="60"/>
    <rect x="385" y="97" width="24" height="38"/>
    <rect x="420" y="115" width="24" height="20"/>
    <rect x="455" y="126" width="24" height="9"/>
  </g>
  <text x="315" y="149" fill="#666" font-size="10">low freq.</text>
  <text x="480" y="149" text-anchor="end" fill="#666" font-size="10">high freq.</text>
  <text x="390" y="162" text-anchor="middle" fill="#222" font-weight="600" font-size="12">frequency components</text>
  <text x="390" y="178" text-anchor="middle" fill="#666" font-size="10">(most energy in low frequencies)</text>

  <line x1="494" y1="105" x2="566" y2="105" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="530" y="95" text-anchor="middle" fill="#222" font-weight="600" font-size="12">quantize</text>

  <!-- Panel 3: sparse integer matrix -->
  <rect x="570" y="20" width="180" height="170" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="580" y="36" font-size="11" fill="#888">3</text>
  <g stroke-width="1">
    <g fill="#bfdbfe" stroke="#93c5fd">
      <rect x="585" y="40" width="30" height="22"/><rect x="617" y="40" width="30" height="22"/><rect x="649" y="40" width="30" height="22"/>
      <rect x="585" y="66" width="30" height="22"/>
      <rect x="585" y="92" width="30" height="22"/><rect x="617" y="92" width="30" height="22"/><rect x="649" y="92" width="30" height="22"/>
      <rect x="585" y="118" width="30" height="22"/>
    </g>
    <g fill="#f3f4f6" stroke="#e5e7eb">
      <rect x="681" y="40" width="30" height="22"/><rect x="713" y="40" width="30" height="22"/>
      <rect x="617" y="66" width="30" height="22"/><rect x="649" y="66" width="30" height="22"/><rect x="681" y="66" width="30" height="22"/><rect x="713" y="66" width="30" height="22"/>
      <rect x="681" y="92" width="30" height="22"/><rect x="713" y="92" width="30" height="22"/>
      <rect x="617" y="118" width="30" height="22"/><rect x="649" y="118" width="30" height="22"/><rect x="681" y="118" width="30" height="22"/><rect x="713" y="118" width="30" height="22"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1e3a8a">
    <text x="600" y="55">124</text><text x="632" y="55">12</text><text x="664" y="55">-3</text>
    <text x="600" y="81">-86</text>
    <text x="600" y="107">344</text><text x="632" y="107">3</text><text x="664" y="107">1</text>
    <text x="600" y="133">-45</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#b0b0b0">
    <text x="696" y="55">0</text><text x="728" y="55">0</text>
    <text x="632" y="81">0</text><text x="664" y="81">0</text><text x="696" y="81">0</text><text x="728" y="81">0</text>
    <text x="696" y="107">0</text><text x="728" y="107">0</text>
    <text x="632" y="133">0</text><text x="664" y="133">0</text><text x="696" y="133">0</text><text x="728" y="133">0</text>
  </g>
  <text x="660" y="162" text-anchor="middle" fill="#222" font-weight="600" font-size="12">sparse integer matrix</text>
  <text x="660" y="178" text-anchor="middle" fill="#666" font-size="10">(row = action dim, col = frequency)</text>

  <!-- Flatten arrow -->
  <path d="M660,192 L660,222 L200,222 L200,248" fill="none" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="395" y="213" width="70" height="18" fill="#ffffff"/>
  <text x="430" y="226" text-anchor="middle" fill="#222" font-weight="600" font-size="12">flatten</text>

  <!-- Panel 4: flattened sequence -->
  <rect x="10" y="250" width="380" height="150" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="20" y="266" font-size="11" fill="#888">4</text>
  <g stroke-width="1">
    <g fill="#bfdbfe" stroke="#93c5fd">
      <rect x="24" y="300" width="28" height="26" rx="4"/><rect x="57" y="300" width="28" height="26" rx="4"/><rect x="90" y="300" width="28" height="26" rx="4"/>
      <rect x="123" y="300" width="28" height="26" rx="4"/><rect x="156" y="300" width="28" height="26" rx="4"/><rect x="189" y="300" width="28" height="26" rx="4"/>
      <rect x="255" y="300" width="28" height="26" rx="4"/><rect x="321" y="300" width="28" height="26" rx="4"/>
    </g>
    <g fill="#f3f4f6" stroke="#e5e7eb">
      <rect x="222" y="300" width="28" height="26" rx="4"/><rect x="288" y="300" width="28" height="26" rx="4"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="10">
    <g fill="#1e3a8a">
      <text x="38" y="317">124</text><text x="71" y="317">-86</text><text x="104" y="317">344</text><text x="137" y="317">-45</text>
      <text x="170" y="317">178</text><text x="203" y="317">12</text><text x="269" y="317">3</text><text x="335" y="317">15</text>
    </g>
    <g fill="#b0b0b0"><text x="236" y="317">0</text><text x="302" y="317">0</text></g>
    <text x="368" y="317" fill="#555" font-size="14">…</text>
  </g>
  <text x="200" y="350" text-anchor="middle" fill="#666" font-size="10">coarse shape first → fine detail later</text>
  <text x="200" y="380" text-anchor="middle" fill="#222" font-weight="600" font-size="12">flattened, low-frequency first</text>

  <line x1="394" y1="325" x2="466" y2="325" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="430" y="315" text-anchor="middle" fill="#222" font-weight="600" font-size="12">BPE</text>

  <!-- Panel 5: compressed tokens -->
  <rect x="470" y="250" width="280" height="150" rx="8" fill="#fafafa" stroke="#d1d5db"/>
  <text x="480" y="266" font-size="11" fill="#888">5</text>
  <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.3">
    <rect x="490" y="300" width="40" height="26" rx="5"/><rect x="540" y="300" width="40" height="26" rx="5"/><rect x="590" y="300" width="40" height="26" rx="5"/>
    <rect x="640" y="300" width="40" height="26" rx="5"/><rect x="690" y="300" width="40" height="26" rx="5"/>
  </g>
  <g text-anchor="middle" fill="#14532d" font-size="11">
    <text x="510" y="317">978</text><text x="560" y="317">233</text><text x="610" y="317">19</text><text x="660" y="317">1022</text><text x="710" y="317">1</text>
  </g>
  <text x="610" y="350" text-anchor="middle" fill="#666" font-size="10">frequent patterns (e.g. runs of zeros) merged</text>
  <text x="610" y="380" text-anchor="middle" fill="#222" font-weight="600" font-size="12">compressed action tokens</text>

  <!-- Summary -->
  <rect x="10" y="414" width="740" height="42" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="380" y="432" text-anchor="middle" fill="#222" font-weight="600">FAST = DCT → quantize → flatten (low-frequency first) → BPE</text>
  <text x="380" y="449" text-anchor="middle" fill="#444" font-size="11">A smooth chunk becomes a few non-zero numbers; BPE then merges the repeated zeros and patterns into single tokens.</text>
</svg>
