<svg viewBox="0 0 800 510" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="800" height="510" fill="#ffffff"/>

  <!-- Vision column -->
  <rect x="65" y="30" width="90" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="58" text-anchor="middle" fill="#1e3a8a" font-weight="600">image</text>
  <line x1="110" y1="76" x2="110" y2="106" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="45" y="108" width="130" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="110" y="130" text-anchor="middle" fill="#1e3a8a" font-weight="600">vision encoder</text>
  <text x="110" y="147" text-anchor="middle" fill="#1d4ed8" font-size="12">(frozen)</text>
  <line x1="110" y1="158" x2="110" y2="188" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="45" y="190" width="130" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="110" y="212" text-anchor="middle" fill="#14532d" font-weight="600">Perceiver resampler</text>
  <text x="110" y="230" text-anchor="middle" fill="#166534" font-size="11">compresses to</text>
  <text x="110" y="245" text-anchor="middle" fill="#166534" font-size="11">fixed-size K, V</text>
  <line x1="110" y1="256" x2="110" y2="288" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <g fill="#86efac" stroke="#16a34a" stroke-width="1.2">
    <rect x="65" y="290" width="90" height="16" rx="3"/>
    <rect x="65" y="310" width="90" height="16" rx="3"/>
    <rect x="65" y="330" width="90" height="16" rx="3"/>
  </g>
  <text x="110" y="364" text-anchor="middle" fill="#444" font-size="12">visual features</text>
  <text x="110" y="379" text-anchor="middle" fill="#444" font-size="11">(K and V for x-attn)</text>

  <!-- Dashed vision -> cross-attention links -->
  <path d="M157,318 L228,318 L228,174 L296,174" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
  <path d="M228,314 L296,314" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)"/>

  <!-- Language model column -->
  <text x="430" y="22" text-anchor="middle" fill="#444" font-size="11">text tokens only</text>
  <g fill="#ede9fe" stroke="#6d28d9" stroke-width="1.2">
    <rect x="319" y="30" width="38" height="28" rx="4"/><rect x="365" y="30" width="38" height="28" rx="4"/>
    <rect x="411" y="30" width="38" height="28" rx="4"/><rect x="457" y="30" width="38" height="28" rx="4"/>
    <rect x="503" y="30" width="38" height="28" rx="4"/>
  </g>
  <g fill="#4c1d95" text-anchor="middle" font-size="11">
    <text x="338" y="49">w1</text><text x="384" y="49">w2</text><text x="430" y="49">w3</text><text x="476" y="49">w4</text><text x="522" y="49">w5</text>
  </g>
  <g stroke="#555" stroke-width="1.4">
    <line x1="430" y1="60" x2="430" y2="82" marker-end="url(#arr)"/>
    <line x1="430" y1="124" x2="430" y2="142" marker-end="url(#arr)"/>
    <line x1="430" y1="204" x2="430" y2="222" marker-end="url(#arr)"/>
    <line x1="430" y1="264" x2="430" y2="282" marker-end="url(#arr)"/>
    <line x1="430" y1="344" x2="430" y2="358" marker-end="url(#arr)"/>
    <line x1="430" y1="380" x2="430" y2="394" marker-end="url(#arr)"/>
    <line x1="430" y1="436" x2="430" y2="454" marker-end="url(#arr)"/>
  </g>

  <g fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5">
    <rect x="300" y="84" width="260" height="40" rx="6"/>
    <rect x="300" y="224" width="260" height="40" rx="6"/>
    <rect x="300" y="396" width="260" height="40" rx="6"/>
  </g>
  <g fill="#4c1d95" text-anchor="middle" font-size="12">
    <text x="430" y="109">frozen self-attention · LM block</text>
    <text x="430" y="249">frozen self-attention · LM block</text>
    <text x="430" y="421">frozen self-attention · LM block</text>
  </g>

  <g fill="#ffedd5" stroke="#ea580c" stroke-width="1.5">
    <rect x="300" y="144" width="260" height="60" rx="6"/>
    <rect x="300" y="284" width="260" height="60" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#7c2d12">
    <text x="430" y="164" font-weight="700">gated cross-attention</text>
    <text x="430" y="181" font-size="11">Q from text · K, V from vision</text>
    <text x="430" y="197" font-size="11">x ← x + tanh(α) · xattn(Q, K, V)</text>
    <text x="430" y="304" font-weight="700">gated cross-attention</text>
    <text x="430" y="321" font-size="11">Q from text · K, V from vision</text>
    <text x="430" y="337" font-size="11">x ← x + tanh(α) · xattn(Q, K, V)</text>
  </g>
  <text x="430" y="376" text-anchor="middle" fill="#555" font-size="16">⋮</text>

  <rect x="320" y="456" width="220" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="476" text-anchor="middle" fill="#14532d" font-size="12">text output: “a cat sitting on a mat”</text>

  <!-- Side notes -->
  <line x1="560" y1="174" x2="585" y2="174" stroke="#999" stroke-width="1.2"/>
  <rect x="585" y="144" width="205" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <g fill="#78350f" font-size="12">
    <text x="598" y="166" font-weight="700">α learned, init = 0</text>
    <text x="598" y="184">tanh(0) = 0 → x ← x</text>
    <text x="598" y="200">LM fully preserved at start</text>
  </g>
  <rect x="585" y="228" width="205" height="124" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.3"/>
  <g fill="#7c2d12" font-size="12">
    <text x="598" y="250" font-weight="700">Trained</text>
    <text x="598" y="270">• cross-attention layers</text>
    <text x="598" y="288">• Perceiver resampler</text>
    <text x="598" y="306">• tanh gates α (one per layer)</text>
  </g>
  <text x="598" y="336" fill="#4c1d95" font-size="12" font-weight="600">Frozen: vision encoder, LM</text>
</svg>
