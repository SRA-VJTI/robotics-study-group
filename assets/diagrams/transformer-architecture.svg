<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 425" width="740" height="425" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
</defs>
<rect width="740" height="425" fill="#ffffff"/>
<text x="180" y="28" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Encoder (reads the source, bidirectional)</text>
<text x="540" y="28" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Decoder (writes the target, causal)</text>
<rect x="60" y="378" width="240" height="30" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="180.0" y="398" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">source tokens</text>
<line x1="180.0" y1="378" x2="180.0" y2="342" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="60" y="308" width="240" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="180.0" y="330" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">embedding + position</text>
<line x1="180.0" y1="308" x2="180.0" y2="272" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="60" y="226" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="180.0" y="247" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Self-attention</text>
<text x="180.0" y="264" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">every token sees every token</text>
<line x1="180.0" y1="226" x2="180.0" y2="204" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="60" y="170" width="240" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="180.0" y="192" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Feed-forward</text>
<line x1="180.0" y1="170" x2="180.0" y2="134" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="60" y="100" width="240" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="180.0" y="122" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Encoder output (K, V)</text>
<text x="310" y="205" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="start">x N</text>
<rect x="420" y="378" width="240" height="30" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="540.0" y="398" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">target tokens so far</text>
<line x1="540.0" y1="378" x2="540.0" y2="342" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="420" y="308" width="240" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="540.0" y="330" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">embedding + position</text>
<line x1="540.0" y1="308" x2="540.0" y2="288" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="420" y="242" width="240" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="540.0" y="263" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Masked self-attention</text>
<text x="540.0" y="280" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">only past tokens and itself</text>
<line x1="540.0" y1="242" x2="540.0" y2="222" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="420" y="176" width="240" height="46" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="540.0" y="197" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">Cross-attention</text>
<text x="540.0" y="214" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">Q from decoder, K and V from encoder</text>
<line x1="540.0" y1="176" x2="540.0" y2="156" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="420" y="122" width="240" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="540.0" y="144" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Feed-forward</text>
<line x1="540.0" y1="122" x2="540.0" y2="102" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<rect x="420" y="68" width="240" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="540.0" y="90" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">Linear + softmax</text>
<line x1="540.0" y1="68" x2="540.0" y2="48" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="540.0" y="44" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">next-token probabilities</text>
<text x="670" y="205" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="start">x N</text>
<path d="M300,117 L360,117 L360,199 L420,199" fill="none" stroke="#ea580c" stroke-width="2.2" marker-end="url(#ao)"/>
<text x="360" y="108" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">K, V</text>

</svg>
