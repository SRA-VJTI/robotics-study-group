</defs>
<rect width="720" height="340" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="bold" fill="#1f2937" text-anchor="start">RNN unrolled over time: one cell, reused at every step</text>
<rect x="70" y="130" width="110" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="125" y="158" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">RNN cell</text>
<text x="125" y="176" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">same weights</text>
<rect x="95" y="252" width="60" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="125" y="274" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">x1</text>
<line x1="125" y1="252" x2="125" y2="192" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<line x1="125" y1="130" x2="125" y2="100" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="125" y="92" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">y1</text>
<rect x="230" y="130" width="110" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="285" y="158" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">RNN cell</text>
<text x="285" y="176" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">same weights</text>
<rect x="255" y="252" width="60" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="285" y="274" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">x2</text>
<line x1="285" y1="252" x2="285" y2="192" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<line x1="285" y1="130" x2="285" y2="100" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="285" y="92" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">y2</text>
<rect x="390" y="130" width="110" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="445" y="158" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">RNN cell</text>
<text x="445" y="176" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">same weights</text>
<rect x="415" y="252" width="60" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="445" y="274" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">x3</text>
<line x1="445" y1="252" x2="445" y2="192" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<line x1="445" y1="130" x2="445" y2="100" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="445" y="92" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">y3</text>
<rect x="550" y="130" width="110" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="605" y="158" font-size="14" font-weight="bold" fill="#1f2937" text-anchor="middle">RNN cell</text>
<text x="605" y="176" font-size="11" font-weight="normal" fill="#6b7280" text-anchor="middle">same weights</text>
<rect x="575" y="252" width="60" height="34" rx="6" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<text x="605" y="274" font-size="14" font-weight="normal" fill="#1f2937" text-anchor="middle">x4</text>
<line x1="605" y1="252" x2="605" y2="192" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<line x1="605" y1="130" x2="605" y2="100" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="605" y="92" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">y4</text>
<line x1="20" y1="160" x2="70" y2="160" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="30" y="150" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="start">h0</text>
<line x1="180" y1="160" x2="230" y2="160" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="205.0" y="150" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">h1</text>
<line x1="340" y1="160" x2="390" y2="160" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="365.0" y="150" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">h2</text>
<line x1="500" y1="160" x2="550" y2="160" stroke="#1f2937" stroke-width="1.8" marker-end="url(#ad)"/>
<text x="525.0" y="150" font-size="13" font-weight="bold" fill="#1f2937" text-anchor="middle">h3</text>
<path d="M575,128 C545,108 505,108 475,128" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>
<path d="M415,128 C385,108 345,108 315,128" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>
<path d="M255,128 C225,108 185,108 155,128" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ao)"/>
<text x="365" y="66" font-size="13" font-weight="bold" fill="#ea580c" text-anchor="middle">gradient flows back through every step: shrinks or explodes</text>
<text x="360" y="322" font-size="13" font-weight="normal" fill="#6b7280" text-anchor="middle">Step t needs h(t-1) first, so training cannot run in parallel. All history lives in one fixed-size h.</text>

</svg>
